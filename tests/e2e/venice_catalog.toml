# The Venice roster for the live E2E suite.
#
# Sources, both checked on 2026-08-29:
#
# - Venice's live `GET /models` listing, which is the authority for api_model
#   ids, context sizes, and the provider's own capability flags.
# - fabro's `venice.toml`, which contributes the eight established rows and
#   their sampling restrictions.
#
# Capability claims here are assertions: the live suite fails when Venice
# rejects a claimed capability, and the fix is to correct this file, not the
# test. Known claim conflicts and their resolution probes are listed in
# `.ai/plans/live-e2e-test-matrix.md` under "Catalog drift found".
#
# There is deliberately no pricing on any row. Venice reports the cost of
# every response in-band, and the suite asserts that the provider-reported
# cost is what arrives; a catalog estimate would mask a regression in that
# extraction.

schema_version = 1

[providers.venice]
display_name = "Venice"
aliases = ["venice-ai"]
adapter = "openai-compatible"
codec = "openai-chat"
base_url = "https://api.venice.ai/api/v1"
# Passthrough lets the negative suite send a model id the catalog does not
# know, so the live NotFound classification can be observed.
allow_passthrough = true
default_model = "deepseek-v4-flash"

[providers.venice.auth]
type = "bearer"

# Venice injects its own system prompt (~1,800-2,700 tokens per request)
# unless a request turns it off. lithos-llm applications set their own
# system prompts, so the catalog turns the injection off for every request;
# a request can set it back through `provider_options`.
[providers.venice.default_options]
venice_parameters = { include_venice_system_prompt = false }

[providers.venice.models."kimi-k3"]
display_name = "Kimi K3"
api_model = "kimi-k3"
limits = { context_tokens = 1000000, max_output_tokens = 131072 }
# Effort levels: the live API claims support; fabro's catalog lists none.
# Sampling: fabro marks sampling_params = false.
capabilities = { text = true, images = true, tools = true, structured_output = true, reasoning = true, reasoning_effort_levels = true, caching = true }

[providers.venice.models."kimi-k3-fast"]
display_name = "Kimi K3 Fast"
api_model = "kimi-k3-fast-api"
limits = { context_tokens = 1000000, max_output_tokens = 131072 }
capabilities = { text = true, images = true, tools = true, structured_output = true, reasoning = true, reasoning_effort_levels = true, caching = true }

[providers.venice.models."grok-4.6"]
display_name = "Grok 4.6"
api_model = "grok-4-6"
limits = { context_tokens = 500000, max_output_tokens = 200000 }
capabilities = { text = true, images = true, tools = true, structured_output = true, reasoning = true, reasoning_effort_levels = true, caching = true, sampling = true }

[providers.venice.models."glm-5.3"]
display_name = "GLM 5.3"
api_model = "z-ai-glm-5-3"
limits = { context_tokens = 1000000, max_output_tokens = 131072 }
# Effort levels: fabro claims low/high/max, but the live API says the model
# takes no effort level, so this row follows the live API.
capabilities = { text = true, tools = true, structured_output = true, reasoning = true, caching = true, sampling = true }

