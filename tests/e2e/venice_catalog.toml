[providers.venice.models."qwen3.8-27b"]
display_name = "Qwen 3.8 27B"
api_model = "qwen-3-8-27b"
limits = { context_tokens = 262144, max_output_tokens = 65536 }
# The one roster model without cache pricing, so caching stays unclaimed.
capabilities = { text = true, images = true, tools = true, structured_output = true, reasoning = true, reasoning_effort_levels = true, sampling = true }

# The Claude rows carry `cache_breakpoints`: the first full run showed
# Venice's Anthropic upstream caches nothing automatically (all four buckets
# zero across a shared-prefix pair), so the codec must forward
# Anthropic-style cache_control markers.
#
# `reasoning_effort_levels` on these rows follows Venice's listing (true only
# for claude-fable-5), and that listing is wrong about the models: Claude
# Opus 5 takes effort levels upstream, proven through OpenRouter. The flags
# are moot for now because Venice's Anthropic path returns no reasoning at
# all (see `.ai/repros/venice_claude_reasoning_repro.py`); when Venice fixes
# that path, re-probe and set these from live behavior, not the listing.
[providers.venice.models."claude-fable-5"]
display_name = "Claude Fable 5"
api_model = "claude-fable-5"
limits = { context_tokens = 1000000, max_output_tokens = 128000 }
capabilities = { text = true, images = true, tools = true, structured_output = true, reasoning = true, reasoning_effort_levels = true, caching = true, cache_breakpoints = true, sampling = true }

