# The OpenAI E2E catalog: the same rows as the built-in
# `src/catalog/builtin/openai.toml`, pinned to it by the preflight roster
# test. Pricing stays on the rows because OpenAI reports token usage rather
# than in-band cost, so the suite's cost assertions prove the catalog
# estimate (`CostSource::Catalog`). The verification history and the
# ChatGPT/Codex access-path notes live in the built-in file.

schema_version = 1

[providers.openai]
display_name = "OpenAI"
aliases = ["oa"]
adapter = "openai"
codec = "openai-responses"
base_url = "https://api.openai.com"
priority = 100
allow_passthrough = true
default_model = "gpt-5.6-sol"

[providers.openai.auth]
type = "bearer"

[providers.openai.metadata.fabro]
api_key_url = "https://platform.openai.com/api-keys"

[providers.openai.models."gpt-5.6-sol"]
display_name = "GPT-5.6 Sol"
aliases = ["sol", "gpt-sol", "gpt56-sol", "gpt-56-sol", "gpt-5.6", "gpt56", "gpt-56"]
api_model = "gpt-5.6-sol"
limits = { context_tokens = 1050000, max_output_tokens = 128000 }
capabilities = { text = true, images = true, tools = true, structured_output = true, reasoning = true, reasoning_effort_levels = true, caching = true, cache_routing = true }
pricing = { input_usd_micros_per_million = 4000000, output_usd_micros_per_million = 20000000, cached_input_usd_micros_per_million = 400000, cache_write_usd_micros_per_million = 5000000, long_context = { above_input_tokens = 272000, input_usd_micros_per_million = 8000000, output_usd_micros_per_million = 30000000, cached_input_usd_micros_per_million = 800000, cache_write_usd_micros_per_million = 10000000 }, speed = { fast = { input_usd_micros_per_million = 8000000, output_usd_micros_per_million = 40000000, cached_input_usd_micros_per_million = 800000, cache_write_usd_micros_per_million = 10000000 }, economical = { input_usd_micros_per_million = 2000000, output_usd_micros_per_million = 10000000, cached_input_usd_micros_per_million = 200000, cache_write_usd_micros_per_million = 2500000 } } }

[providers.openai.models."gpt-5.6-sol".metadata.fabro]
agent_profile = "gpt56"
family = "gpt-5"
training = "2026-02-16"
knowledge_cutoff = "February 16, 2026"

[providers.openai.models."gpt-5.6-terra"]
display_name = "GPT-5.6 Terra"
aliases = ["terra", "gpt-terra", "gpt56-terra", "gpt-56-terra"]
api_model = "gpt-5.6-terra"
limits = { context_tokens = 1050000, max_output_tokens = 128000 }
capabilities = { text = true, images = true, tools = true, structured_output = true, reasoning = true, reasoning_effort_levels = true, caching = true, cache_routing = true }
pricing = { input_usd_micros_per_million = 2000000, output_usd_micros_per_million = 12000000, cached_input_usd_micros_per_million = 200000, cache_write_usd_micros_per_million = 2500000, long_context = { above_input_tokens = 272000, input_usd_micros_per_million = 4000000, output_usd_micros_per_million = 18000000, cached_input_usd_micros_per_million = 400000, cache_write_usd_micros_per_million = 5000000 }, speed = { fast = { input_usd_micros_per_million = 4000000, output_usd_micros_per_million = 24000000, cached_input_usd_micros_per_million = 400000, cache_write_usd_micros_per_million = 5000000 }, economical = { input_usd_micros_per_million = 1000000, output_usd_micros_per_million = 6000000, cached_input_usd_micros_per_million = 100000, cache_write_usd_micros_per_million = 1250000 } } }

[providers.openai.models."gpt-5.6-terra".metadata.fabro]
agent_profile = "gpt56"
family = "gpt-5"
training = "2026-02-16"
knowledge_cutoff = "February 16, 2026"

[providers.openai.models."gpt-5.6-luna"]
display_name = "GPT-5.6 Luna"
aliases = ["luna", "gpt-luna", "gpt56-luna", "gpt-56-luna"]
api_model = "gpt-5.6-luna"
limits = { context_tokens = 1050000, max_output_tokens = 128000 }
# Luna rejected `temperature` with a 400 on 2026-08-30, so the sampling
# claim an earlier revision of this row carried is gone.
capabilities = { text = true, images = true, tools = true, structured_output = true, reasoning = true, reasoning_effort_levels = true, caching = true, cache_routing = true }
pricing = { input_usd_micros_per_million = 200000, output_usd_micros_per_million = 1200000, cached_input_usd_micros_per_million = 20000, cache_write_usd_micros_per_million = 250000, long_context = { above_input_tokens = 272000, input_usd_micros_per_million = 400000, output_usd_micros_per_million = 1800000, cached_input_usd_micros_per_million = 40000, cache_write_usd_micros_per_million = 500000 }, speed = { fast = { input_usd_micros_per_million = 400000, output_usd_micros_per_million = 2400000, cached_input_usd_micros_per_million = 40000, cache_write_usd_micros_per_million = 500000 }, economical = { input_usd_micros_per_million = 100000, output_usd_micros_per_million = 600000, cached_input_usd_micros_per_million = 10000, cache_write_usd_micros_per_million = 125000 } } }

[providers.openai.models."gpt-5.6-luna".metadata.fabro]
agent_profile = "gpt56"
family = "gpt-5"
training = "2026-02-16"
knowledge_cutoff = "February 16, 2026"

[providers.openai.models."gpt-5.4"]
display_name = "GPT-5.4"
aliases = ["gpt54", "gpt-54", "gpt-5.2", "gpt5", "gpt-5.3-codex", "codex"]
api_model = "gpt-5.4"
limits = { context_tokens = 1050000, max_output_tokens = 128000 }
capabilities = { text = true, images = true, tools = true, structured_output = true, reasoning = true, reasoning_effort_levels = true, caching = true, cache_routing = true, sampling = true }
# The flex cached-input rate renders as $0.13 on the pricing page; flex is
# exactly half of standard everywhere else on the page, so the rate below
# is the unrounded 0.5 x $0.25.
pricing = { input_usd_micros_per_million = 2500000, output_usd_micros_per_million = 15000000, cached_input_usd_micros_per_million = 250000, long_context = { above_input_tokens = 272000, input_usd_micros_per_million = 5000000, output_usd_micros_per_million = 22500000, cached_input_usd_micros_per_million = 500000 }, speed = { fast = { input_usd_micros_per_million = 5000000, output_usd_micros_per_million = 30000000, cached_input_usd_micros_per_million = 500000 }, economical = { input_usd_micros_per_million = 1250000, output_usd_micros_per_million = 7500000, cached_input_usd_micros_per_million = 125000 } } }

[providers.openai.models."gpt-5.4".metadata.fabro]
family = "gpt-5"
training = "2025-08-31"
# fabro carried "April 2025", but the developer docs date the 5.4 family's
# cutoff August 31, 2025.
knowledge_cutoff = "August 31, 2025"
estimated_output_tps = 70

[providers.openai.models."gpt-5.5"]
display_name = "GPT-5.5"
aliases = ["gpt55", "gpt-55"]
api_model = "gpt-5.5"
limits = { context_tokens = 1050000, max_output_tokens = 128000 }
capabilities = { text = true, images = true, tools = true, structured_output = true, reasoning = true, reasoning_effort_levels = true, caching = true, cache_routing = true }
# Priority on this row is 2.5x standard, not the 2x every other fast tier
# uses — the pricing page lists $12.50/$75.00 against $5.00/$30.00.
pricing = { input_usd_micros_per_million = 5000000, output_usd_micros_per_million = 30000000, cached_input_usd_micros_per_million = 500000, long_context = { above_input_tokens = 272000, input_usd_micros_per_million = 10000000, output_usd_micros_per_million = 45000000, cached_input_usd_micros_per_million = 1000000 }, speed = { fast = { input_usd_micros_per_million = 12500000, output_usd_micros_per_million = 75000000, cached_input_usd_micros_per_million = 1250000 }, economical = { input_usd_micros_per_million = 2500000, output_usd_micros_per_million = 15000000, cached_input_usd_micros_per_million = 250000 } } }

[providers.openai.models."gpt-5.5".metadata.fabro]
family = "gpt-5"
training = "2025-12-01"
knowledge_cutoff = "December 2025"
estimated_output_tps = 70

[providers.openai.models."gpt-5.5-pro"]
display_name = "GPT-5.5 Pro"
aliases = ["gpt55-pro", "gpt-55-pro"]
api_model = "gpt-5.5-pro"
limits = { context_tokens = 1050000, max_output_tokens = 128000 }
# No caching claim: the pricing page lists no cached rate and the model
# page says prompt caching is unsupported. No speed tiers: the pro rows
# are absent from the priority and flex tables, and a priority request was
# observed downgrading to `default` on 2026-08-30.
capabilities = { text = true, images = true, tools = true, structured_output = true, reasoning = true, reasoning_effort_levels = true }
pricing = { input_usd_micros_per_million = 30000000, output_usd_micros_per_million = 180000000, long_context = { above_input_tokens = 272000, input_usd_micros_per_million = 60000000, output_usd_micros_per_million = 270000000 } }

[providers.openai.models."gpt-5.5-pro".metadata.fabro]
family = "gpt-5"
training = "2025-12-01"
knowledge_cutoff = "December 2025"
estimated_output_tps = 20

[providers.openai.models."gpt-5.4-pro"]
display_name = "GPT-5.4 Pro"
aliases = ["gpt54-pro", "gpt-54-pro"]
api_model = "gpt-5.4-pro"
# fabro carried 1,047,576; the model page says 1,050,000 like the rest of
# the family.
limits = { context_tokens = 1050000, max_output_tokens = 128000 }
capabilities = { text = true, images = true, tools = true, structured_output = true, reasoning = true, reasoning_effort_levels = true }
pricing = { input_usd_micros_per_million = 30000000, output_usd_micros_per_million = 180000000, long_context = { above_input_tokens = 272000, input_usd_micros_per_million = 60000000, output_usd_micros_per_million = 270000000 } }

[providers.openai.models."gpt-5.4-pro".metadata.fabro]
family = "gpt-5"
training = "2025-08-31"
knowledge_cutoff = "August 31, 2025"
estimated_output_tps = 20

[providers.openai.models."gpt-5.4-mini"]
display_name = "GPT-5.4 Mini"
aliases = ["gpt54-mini", "gpt-54-mini", "gpt-5.3-codex-spark", "codex-spark"]
api_model = "gpt-5.4-mini"
# Input is additionally capped at 272,000 tokens, which is also why this
# row has no long-context rates: a request can never cross the threshold.
limits = { context_tokens = 400000, max_output_tokens = 128000 }
capabilities = { text = true, images = true, tools = true, structured_output = true, reasoning = true, reasoning_effort_levels = true, caching = true, cache_routing = true, sampling = true }
pricing = { input_usd_micros_per_million = 750000, output_usd_micros_per_million = 4500000, cached_input_usd_micros_per_million = 75000, speed = { fast = { input_usd_micros_per_million = 1500000, output_usd_micros_per_million = 9000000, cached_input_usd_micros_per_million = 150000 }, economical = { input_usd_micros_per_million = 375000, output_usd_micros_per_million = 2250000, cached_input_usd_micros_per_million = 37500 } } }

[providers.openai.models."gpt-5.4-mini".metadata.fabro]
family = "gpt-5"
training = "2025-08-31"
knowledge_cutoff = "August 31, 2025"
estimated_output_tps = 140
probe = true
small_default = true
