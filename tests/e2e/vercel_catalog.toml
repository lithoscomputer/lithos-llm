# ---------- TypeSafe AI via Vercel ----------

# The gateway's one evaluation model. Its listing row (2026-09-17) says
# `type: evaluation` and `context_window: 0`, so the row carries no limits.
# The wire id is `typesafe-ai/jev`; the SDK example's `typesafe-ai/jev-latest`
# is a 404 on the gateway. The listing prices $0.042 per million input
# tokens and nothing for output. The row writes no `codecs` line: its
# explicit `evaluation` claim and the absence of any generation claim derive
# `["vercel-evaluation"]`, so this row alone speaks the gateway's evaluation
# protocol at `/v4/ai/evaluation-model`, which the codec derives from the
# provider's `/v1` base URL, and `complete` refuses it before dispatch. Every
# other row keeps Chat Completions. A live smoke test on
# 2026-09-17 answered the three-question evaluation in about 300 ms for
# $0.000016, with two-decimal rounding, a probability per option and per
# level, and confidence on the choice and score answers.
[providers.vercel.models."jev"]
display_name = "TypeSafe AI Jev (via Vercel)"
api_model = "typesafe-ai/jev"
capabilities = { evaluation = { choice = true, score = true, boolean = true } }
