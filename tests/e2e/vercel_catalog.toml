# The Vercel AI Gateway roster for the live E2E suite: the built-in rows
# without pricing, so the cost assertion proves the in-band `usage.cost`
# extraction. Built on 2026-09-17 from the gateway's public
# `GET /v1/models` listing (no key needed) and raw Chat Completions probes
# with a team key. The roster mirrors the OpenRouter roster: every OpenRouter
# row the gateway lists is here under the same catalog id, aliases, and
# profile, with the gateway's own wire id, limits, and prices. Three
# OpenRouter rows are absent because the gateway does not list them:
# laguna-xs-2.1, qwen3.6-flash, and devstral-2512.
# One row is outside that roster: TypeSafe's Jev evaluation model, in its
# own section at the end.
#
# The listing is unusually complete. Each row carries `context_window`,
# `max_tokens`, `supported_parameters`, `temperature` (whether the model
# takes one), `reasoning_options` (the named effort levels), input
# modalities, and per-token prices as decimal strings, so most flags below
# come straight from it. Vercel adds no markup: the rows carry the upstream
# rates, converted from USD per token to USD micros per million. Regional
# and `fast` sub-tables in the listing are not represented; the Chat
# Completions codec has no speed control, so `speed.fast` stays unclaimed
# even where the gateway prices a fast tier (Claude Opus 5, GPT-5.6).
#
# Probe findings that shaped the rows (2026-09-17 unless dated otherwise):
# - The gateway reports cost in-band: `usage.cost` on every response, plus
#   `cache_creation_input_tokens` and `prompt_tokens_details.cached_tokens`.
#   A `cache_control` breakpoint on Claude Sonnet 5 wrote 15,381 tokens on
#   the first call and read them all back on the second, so the Claude rows
#   claim `cache_breakpoints`. The provider-reported cost wins over these
#   rates; the rows price what a response fails to report.
# - `reasoning_effort` is accepted on every reasoning row and the gateway
#   maps it to the upstream's control, including levels the listing omits
#   (Kimi K3 and GLM 5.3 both took `medium`). The rows spell out the
#   listing's levels anyway so an application can pick a supported one.
#   The listing's `none` level has no lithos-llm equivalent and is dropped.
# - Reasoning text comes back as `reasoning` plus `reasoning_details`
#   (`reasoning.text`, or `reasoning.summary` and `reasoning.encrypted` on
#   OpenAI and Grok), which the codec already stores and replays. The Claude
#   rows returned no reasoning text on 2026-09-17, only `reasoning_tokens`;
#   on 2026-09-19 Opus 5, Fable 5, and Fable 5.1 all returned signed
#   `reasoning.text` entries.
# - The listing says Sonnet 5 and Kimi K3 take no temperature, but the
#   gateway accepted one on both without a warning, so both claim sampling.
#   Opus 5 and Fable 5, listed the same way, took one on 2026-09-19 once
#   they could be probed (200, no warning), so every Claude row claims it.
# - Fable 5.1 answers a forced tool choice with Anthropic's 400
#   (`tool_choice: type "tool" and "any" are not supported for this
#   model.`), so its row claims tools without forced choice. Every other
#   row honored `required`; Sonnet 5 and Kimi K3 honored a named choice.
# - JSON Schema output conformed on every row that claims it. It did not on
#   GLM 4.6 (`{"answer": ...}` twice), MiMo (schema ignored), Qwen 3.8 27B
#   (an array around the object, twice), Kimi K2.6 (prose), or Qwen3 Coder
#   (two 120-second timeouts), so those rows claim `json_object` at most.
# - The 64x64 PNG fixture the OpenRouter suite uses is rejected as an
#   invalid PNG by the Grok and OpenAI upstreams through this gateway; a
#   freshly encoded 64x64 PNG was read correctly by every image row.
# - Stop sequences are ignored by the GPT rows, MiMo, MiniMax, and Grok, and
#   Nemotron rejects the field outright. No capability records stop support;
#   the E2E suite pins these.
# - On 2026-09-17 the gateway applied a per-model rate limit to Claude Opus
#   5, Fable 5, and Fable 5.1 on the team behind the probes: one request per
#   model in each five-to-six-minute window, every later request answered
#   `429 rate_limit_exceeded` / `No access to this model at this time` with
#   zero provider attempts in the routing metadata (measured 19:28-19:55
#   UTC, unchanged by a credit purchase during the window). Vercel lifted
#   the limit on 2026-09-19, confirmed by a live probe the same day (six
#   rapid requests to each model, all 200), and the three rows were then
#   probed like the rest; their comments carry the findings. No other
#   roster row was ever limited this way.
# - `prompt_cache_key` is accepted but nothing documents sticky routing, so
#   no row claims `cache_routing`.
#
# Error bodies use the OpenAI shape with string codes
# (`{"error": {"message", "type", "param", "code"}}`); an unknown model is a
# 404 `model_not_found`, a bad key a 401 `authentication_error`.

schema_version = 1

[providers.vercel]
display_name = "Vercel AI Gateway"
codecs = ["openai-chat", "vercel-evaluation"]
base_url = "https://ai-gateway.vercel.sh/v1"
priority = 30
allow_passthrough = true
default_model = "claude-sonnet-5"

[providers.vercel.auth]
type = "bearer"

# The agent profile for this provider's models; a model row overrides it.

# ---------- Anthropic via Vercel ----------

# The one Claude row that takes no forced tool choice: the upstream 400
# (`tool_choice: type "tool" and "any" are not supported for this model.`)
# came straight through the gateway on 2026-09-17 and again on 2026-09-19.
# The listing is the one Claude 5 row with `temperature: true`, and cache
# reads are $0.25/MTok, a quarter of Fable 5's rate. Probed live on
# 2026-09-19 once the per-model rate limit was lifted (see the header):
# sampling, JSON object and JSON Schema output (blocking and streamed),
# vision, and stop sequences all verified, and every effort level was
# accepted. Reasoning is selective: `low`, `medium`, and `high` each
# answered with zero reasoning tokens and the working written into the
# reply (three of three at `high`), while `xhigh` and `max` reasoned (288
# and 264 tokens) and returned signed `reasoning.text` entries. A
# `cache_control` breakpoint wrote 8,315 tokens and read them all back five
# seconds later.
[providers.vercel.models."claude-fable-5.1"]
display_name = "Claude Fable 5.1 (via Vercel)"
api_model = "anthropic/claude-fable-5.1"
limits = { context_tokens = 1000000, max_output_tokens = 128000 }
capabilities = { text = true, images = true, tools = true, response_format = { json_object = true, json_schema = true }, reasoning = true, caching = true, sampling = true, tool_choice = { required = false, named = false }, speed = { fast = false, economical = false }, reasoning_effort = { minimal = false, low = true, medium = true, high = true, xhigh = true, max = false } }
protocol_options = { reasoning_effort_levels = true, cache_breakpoints = true }

# Probed live on 2026-09-19 once the per-model rate limit was lifted (see
# the header). The gateway accepted a temperature and `top_p` with a 200 and
# no warning although the listing says `temperature: false`, so the row
# claims sampling as Sonnet 5's does. A named tool choice, JSON object and
# JSON Schema output (blocking and streamed), vision, and stop sequences
# verified. Every effort level was accepted and reasoned (`low` 75 tokens
# through `xhigh` 247); `max` was accepted too (164 tokens) but stays
# unclaimed because the listing omits it, as on Sonnet 5. Reasoning text
# arrives as signed `reasoning.text` entries. A `cache_control` breakpoint
# wrote 8,316 tokens and read them all back five seconds later.
[providers.vercel.models."claude-fable-5"]
display_name = "Claude Fable 5 (via Vercel)"
aliases = ["fable", "claude-fable"]
api_model = "anthropic/claude-fable-5"
limits = { context_tokens = 1000000, max_output_tokens = 128000 }
capabilities = { text = true, images = true, tools = true, response_format = { json_object = true, json_schema = true }, reasoning = true, caching = true, sampling = true, tool_choice = { required = true, named = true }, speed = { fast = false, economical = false }, reasoning_effort = { minimal = false, low = true, medium = true, high = true, xhigh = true, max = false } }
protocol_options = { reasoning_effort_levels = true, cache_breakpoints = true }

# Probed live on 2026-09-19 once the per-model rate limit was lifted (see
