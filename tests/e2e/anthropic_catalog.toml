# The Anthropic roster for the live-only E2E suite.
#
# Sources checked on 2026-08-29: Anthropic's official model, pricing,
# context-window, caching, effort, thinking, structured-output, vision, PDF,
# tool-use, and API documentation; the authenticated `GET /v1/models`
# listing; and raw Messages API probes. The probes confirmed the native
# `/v1/messages` URL, forced tools, structured output, sampling restrictions,
# cache usage, and the listing's incorrect 1M limit for Sonnet 4.5.
#
# Pricing stays in this catalog because Anthropic reports token usage but no
# in-band cost. The smoke suite therefore asserts `CostSource::Catalog`.

schema_version = 1

[providers.anthropic]
display_name = "Anthropic"
aliases = ["claude"]
adapter = "anthropic"
codec = "anthropic-messages"
base_url = "https://api.anthropic.com"
allow_passthrough = true
default_model = "claude-sonnet-5"

[providers.anthropic.auth]
type = "header"
name = "x-api-key"

# Fable 5.1 returns a 400 for a forced tool choice, so the row claims tools
# without forced_tool_choice and the forced-choice cells skip it; the negative
# suite pins the upstream rejection itself. Cache reads are $0.25/MTok.
# Verified 2026-09-01 against the release notes and the live listing.
[providers.anthropic.models."claude-fable-5.1"]
display_name = "Claude Fable 5.1"
api_model = "claude-fable-5-1"
limits = { context_tokens = 1000000, max_output_tokens = 128000 }
capabilities = { text = true, images = true, documents = true, tools = true, forced_tool_choice = false, structured_output = true, reasoning = true, reasoning_effort_levels = true, caching = true }
pricing = { input_usd_micros_per_million = 10000000, output_usd_micros_per_million = 50000000, cached_input_usd_micros_per_million = 250000, cache_write_usd_micros_per_million = 12500000 }

