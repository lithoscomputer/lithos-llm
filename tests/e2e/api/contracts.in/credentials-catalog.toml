schema_version = 1

[providers.fixture]
display_name = "Fixture"
adapter = "custom"
codec = "custom"
base_url = "http://127.0.0.1"
auth = { type = "none" }

[providers.fallback]
display_name = "Fallback"
adapter = "custom"
codec = "custom"
base_url = "http://127.0.0.1"
auth = { type = "none" }

[providers.aws]
display_name = "AWS"
adapter = "custom"
codec = "custom"
base_url = "http://127.0.0.1"
auth = { type = "none" }

[providers.aws-fallback]
display_name = "AWS fallback"
adapter = "custom"
codec = "custom"
base_url = "http://127.0.0.1"
auth = { type = "none" }

[providers.bedrock]
display_name = "Bedrock"
adapter = "custom"
codec = "custom"
base_url = "http://127.0.0.1"
auth = { type = "none" }

[providers.bedrock-fallback]
display_name = "Bedrock fallback"
adapter = "custom"
codec = "custom"
base_url = "http://127.0.0.1"
auth = { type = "none" }

# Unlisted and multi-header: no single secret name can be derived, so the
# conventional table reports it as not configured.
[providers.unconfigured]
display_name = "Unconfigured"
adapter = "custom"
codec = "custom"
base_url = "http://127.0.0.1"
auth = { type = "headers" }

# Unlisted and unauthenticated: needs no secret, so it resolves to none.
[providers.open]
display_name = "Open"
adapter = "custom"
codec = "custom"
base_url = "http://127.0.0.1"
auth = { type = "none" }

# Unlisted with bearer auth: reads the name derived from its id, ACME_API_KEY,
# which the exercise environment does not set.
[providers.acme]
display_name = "Acme"
adapter = "custom"
codec = "custom"
base_url = "http://127.0.0.1"
auth = { type = "bearer" }

[providers.openai]
display_name = "OpenAI"
adapter = "custom"
codec = "custom"
base_url = "http://127.0.0.1"
auth = { type = "none" }
