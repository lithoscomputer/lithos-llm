# The Google Gemini roster for the live-only E2E suite.
#
# Sources checked on 2026-08-29: Google's official model and pricing pages,
# authenticated `GET /v1beta/models`, and raw GenerateContent probes. The
# built-in catalog has the detailed evidence and conflict notes. Pricing stays
# in this file because Gemini reports token usage, not an in-band dollar cost.

schema_version = 1

[providers.gemini]
display_name = "Google Gemini"
aliases = ["google"]
adapter = "gemini"
codec = "gemini-generate"
base_url = "https://generativelanguage.googleapis.com"
priority = 80
allow_passthrough = true
default_model = "gemini-3.5-flash"
api_key_url = "https://aistudio.google.com/apikey"

[providers.gemini.auth]
type = "header"
name = "x-goog-api-key"

[providers.gemini.models."gemini-3.1-pro-preview"]
display_name = "Gemini 3.1 Pro Preview"
aliases = ["gemini-pro"]
api_model = "gemini-3.1-pro-preview"
limits = { context_tokens = 1048576, max_output_tokens = 65536 }
capabilities = { text = true, images = true, audio = true, documents = true, tools = true, response_format = { json_object = true, json_schema = true }, reasoning = true, caching = true, sampling = true, tool_choice = { required = true, named = true }, speed = { fast = false, economical = false } }
protocol_options = { reasoning_effort_levels = true }
pricing = { input_usd_micros_per_million = 2000000, output_usd_micros_per_million = 12000000, cached_input_usd_micros_per_million = 200000, long_context = { above_input_tokens = 200000, input_usd_micros_per_million = 4000000, output_usd_micros_per_million = 18000000, cached_input_usd_micros_per_million = 400000 } }
family = "gemini-3"
training_cutoff = "2025-01-01"
knowledge_cutoff = "January 2025"
estimated_output_tps = 85

[providers.gemini.models."gemini-3.1-pro-preview-customtools"]
display_name = "Gemini 3.1 Pro Custom Tools Preview"
