# Translated from Fabro inception.toml at 775b62b500c957fe319710fe34e6327ae1eb1bbf.
# Imported 2026-09-05. Limits, prices, and capabilities are provisional
# except for the documentation corrections below. No live tests have run.
# TODO: Complete docs/provider-live-tests.md before claiming live support.
#
# Mercury 2 accepts low/medium/high. Its native instant value is available
# through provider_options.inception.reasoning_effort, not a portable effort.
# https://docs.inceptionlabs.ai/capabilities/reasoning-efforts

schema_version = 1

[providers.inception]
display_name = "Inception"
adapter = "openai-compatible"
codec = "openai-chat"
base_url = "https://api.inceptionlabs.ai/v1"
priority = 40
allow_passthrough = true
default_model = "mercury-2"

[providers.inception.auth]
type = "bearer"

[providers.inception.metadata.fabro]
api_key_url = "https://console.inceptionlabs.ai/api-keys"

[providers.inception.metadata.pebble]
profile = "openai"

[providers.inception.models."mercury-2"]
display_name = "Mercury 2"
aliases = ["mercury"]
api_model = "mercury-2"
limits = { context_tokens = 131072, max_output_tokens = 50000 }
capabilities = { text = true, images = false, tools = true, reasoning = true, caching = false, sampling = true, tool_choice = { required = "unknown", named = "unknown" }, response_format = { json_object = "unknown", json_schema = "unknown" }, speed = { fast = false, economical = false }, reasoning_effort = { minimal = false, low = true, medium = true, high = true, xhigh = false, max = false } }
protocol_options = { reasoning_effort_levels = true }
pricing = { input_usd_micros_per_million = 250000, output_usd_micros_per_million = 750000 }

[providers.inception.models."mercury-2".metadata.fabro]
family = "mercury"
estimated_output_tps = 1000
