capabilities = { text = true, images = true, tools = true, structured_output = true, reasoning = true, reasoning_effort_levels = true, caching = true, cache_routing = true }
pricing = { input_usd_micros_per_million = 4500000, output_usd_micros_per_million = 22500000, cached_input_usd_micros_per_million = 450000 }

[providers.venice.models."kimi-k3-fast".metadata.pebble]
profile = "kimi"

[providers.venice.models."grok-4.6"]
display_name = "Grok 4.6"
aliases = ["grok", "grok46", "grok-46"]
api_model = "grok-4-6"
limits = { context_tokens = 500000, max_output_tokens = 200000 }
capabilities = { text = true, images = true, tools = true, structured_output = true, reasoning = true, reasoning_effort_levels = true, caching = true, cache_routing = true, sampling = true }
pricing = { input_usd_micros_per_million = 2270000, output_usd_micros_per_million = 6800000, cached_input_usd_micros_per_million = 570000 }

[providers.venice.models."glm-5.3"]
display_name = "GLM 5.3"
aliases = ["glm", "glm5", "glm53", "glm5.3", "glm-5-3"]
api_model = "z-ai-glm-5-3"
limits = { context_tokens = 1000000, max_output_tokens = 131072 }
capabilities = { text = true, tools = true, structured_output = true, reasoning = true, caching = true, cache_routing = true, sampling = true }
pricing = { input_usd_micros_per_million = 1750000, output_usd_micros_per_million = 5500000, cached_input_usd_micros_per_million = 325000 }

# GLM 5.3 reasons on every call rather than when a request asks it to, which
# no capability records: it takes a thinking budget, not a named effort
# level. Pebble reads this to size a summarization budget that has to cover
# the thinking as well as the answer.
[providers.venice.models."glm-5.3".metadata.pebble]
reasoning_by_default = true

[providers.venice.models."deepseek-v4-flash"]
