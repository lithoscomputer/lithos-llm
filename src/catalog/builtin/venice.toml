# Venice, merged from fabro's `venice.toml` (its eight rows and their
# aliases and sampling restrictions) and this crate's live E2E findings
# against the Venice API on 2026-08-29 (api_model ids, limits, capability
# corrections, cache flags). Where the two disagreed, live behavior won:
# the kimi rows do take effort levels, glm-5.3 does not, qwen3.8-max takes
# no response schema, and grok-4.6's output limit is 200k, not fabro's 32k.
# Pricing is Venice's live listing. Venice reports the cost of every
# response in-band, and a provider-reported cost wins over these rates, so
# the rows price only what a response failed to report.
#
# The Claude rows carry `cache_breakpoints`: Venice's Anthropic upstream
# caches nothing automatically, so the codec forwards cache_control
# markers. `reasoning_effort_levels` on the Claude rows follows Venice's
# listing, which reflects Venice's own per-model opt-in rather than the
# models; re-probe when Venice's Anthropic path starts returning reasoning.
#
# Claude Fable 5.1 was added on 2026-09-01 from the live listing and probes.
# Venice lists it at Anthropic's own rates ($10/$50, cache reads $0.25),
# below its marked-up Fable 5 rates; the listing wins.
#
# GPT-6 Sol and Luna were added on 2026-09-22 from the live listing and
# probes; see the comment above their rows.
#
# Claude Opus 5.5 was added on 2026-09-22 from the live listing and probes.

schema_version = 1

[providers.venice]
display_name = "Venice"
aliases = ["venice-ai"]
# Venice serves Chat Completions at `/api/v1/chat/completions` and the
# Responses API at `/api/v1/responses` (its OpenAPI spec, checked
# 2026-11-20). The client takes the first generation codec, so its calls
# stay on Chat Completions, where the rows' claims and the E2E cells were
# verified; Responses is listed so callers can find the endpoint, and no
# cell exercises it yet. Venice forwards most OpenAI models to OpenAI's
# Responses API natively and translates every other model through Chat
# Completions, where some Responses features are ignored or rejected. It
# stores nothing: `previous_response_id` returns 400 in native mode and is
# ignored in translated mode, so send the whole conversation every time.
codecs = ["openai-chat", "openai-responses"]
base_url = "https://api.venice.ai/api/v1"
priority = 35
allow_passthrough = true
default_model = "deepseek-v4-flash"

[providers.venice.auth]
type = "bearer"

# Venice injects its own system prompt (~1,800-2,700 tokens per request)
# unless a request turns it off. lithos-llm applications set their own
# system prompts, so the catalog turns the injection off for every request;
# a request can set it back through `provider_options`.
[providers.venice.default_options]
venice_parameters = { include_venice_system_prompt = false }

# The agent profile for this provider's models; a model row overrides it.
[providers.venice.metadata.agent]
profile = "openai"

[providers.venice.models."kimi-k3"]
display_name = "Kimi K3"
aliases = ["kimi"]
api_model = "kimi-k3"
limits = { context_tokens = 1000000, max_output_tokens = 131072 }
capabilities = { text = true, images = true, tools = true, response_format = { json_object = true, json_schema = true }, reasoning = true, caching = true, cache_routing = true, tool_choice = { required = true, named = true }, speed = { fast = false, economical = false }, reasoning_effort = { minimal = false, low = true, medium = false, high = true, xhigh = false, max = true } }
protocol_options = { reasoning_effort_levels = true }
pricing = { input_usd_micros_per_million = 3750000, output_usd_micros_per_million = 18750000, cached_input_usd_micros_per_million = 375000 }

[providers.venice.models."kimi-k3".metadata.agent]
