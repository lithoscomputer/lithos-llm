capabilities = { text = true, tools = true, structured_output = true, reasoning = true, reasoning_effort_levels = true, caching = true, cache_routing = true }
pricing = { input_usd_micros_per_million = 175000, output_usd_micros_per_million = 350000, cached_input_usd_micros_per_million = 35000 }

[providers.venice.models."deepseek-v4-flash".metadata.pebble]
