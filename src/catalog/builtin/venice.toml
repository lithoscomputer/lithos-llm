capabilities = { text = true, tools = true, structured_output = true, reasoning = true, caching = true, cache_routing = true }
pricing = { input_usd_micros_per_million = 1650000, output_usd_micros_per_million = 4950000, cached_input_usd_micros_per_million = 165000 }

# DeepSeek V4 Pro reasons on every call; the flash row takes a named effort
# level, this one only a thinking budget, so no capability records it.
[providers.venice.models."deepseek-v4-pro".metadata.pebble]
profile = "openai"
