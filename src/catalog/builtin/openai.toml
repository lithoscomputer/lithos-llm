limits = { context_tokens = 1050000, max_output_tokens = 128000 }
# No caching claim: the pricing page lists no cached rate and the model
# page says prompt caching is unsupported. No speed tiers: the pro rows
# are absent from the priority and flex tables, and a priority request was
