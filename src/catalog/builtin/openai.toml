aliases = ["gpt54", "gpt-54", "gpt-5.2", "gpt5", "gpt-5.3-codex", "codex"]
api_model = "gpt-5.4"
limits = { context_tokens = 1050000, max_output_tokens = 128000 }
capabilities = { text = true, images = true, documents = true, tools = true, response_format = { json_object = true, json_schema = true }, reasoning = true, caching = true, cache_routing = true, sampling = true, tool_choice = { required = true, named = true }, speed = { fast = true, economical = true } }
protocol_options = { reasoning_effort_levels = true }
# The flex cached-input rate renders as $0.13 on the pricing page; flex is
# exactly half of standard everywhere else on the page, so the rate below
# is the unrounded 0.5 x $0.25.
pricing = { input_usd_micros_per_million = 2500000, output_usd_micros_per_million = 15000000, cached_input_usd_micros_per_million = 250000, long_context = { above_input_tokens = 272000, input_usd_micros_per_million = 5000000, output_usd_micros_per_million = 22500000, cached_input_usd_micros_per_million = 500000 }, speed = { fast = { input_usd_micros_per_million = 5000000, output_usd_micros_per_million = 30000000, cached_input_usd_micros_per_million = 500000 }, economical = { input_usd_micros_per_million = 1250000, output_usd_micros_per_million = 7500000, cached_input_usd_micros_per_million = 125000 } } }
family = "gpt-5"
training_cutoff = "2025-08-31"
# fabro carried "April 2025", but the developer docs date the 5.4 family's
# cutoff August 31, 2025.
knowledge_cutoff = "August 31, 2025"
estimated_output_tps = 70

[providers.openai.models."gpt-5.5"]
display_name = "GPT-5.5"
aliases = ["gpt55", "gpt-55"]
api_model = "gpt-5.5"
