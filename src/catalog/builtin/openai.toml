# OpenAI, translated from fabro's `openai.toml`. The GPT-5 rows were verified
# on 2026-08-30 against the authenticated `GET /v1/models` listing, the
# developer docs' model and pricing pages, and raw `/v1/responses` probes.
# GPT-6 Astra was added from the developer docs on 2026-09-03 while API access
# was still rolling out. An authenticated model listing did not contain Astra,
# and a request returned 404 `model_not_found`. Where fabro and the live sources
# disagreed, the live sources won:
#
# - The GPT-5.6 prices fabro carried (luna at $1.00/$6.00) are stale; the
#   pricing page lists luna at $0.20/$1.20 with cached input at $0.02.
# - Every row but gpt-5.4-mini has a 1,050,000-token context window, not
#   fabro's 272,000; the 272K figure is the long-context billing threshold,
#   above which the whole request bills at 2x input and 1.5x output.
# - gpt-5.4-mini's window is 400,000 tokens with input capped at 272,000,
#   so it never crosses the threshold and carries no long-context rates.
# - GPT-6 Astra and the GPT-5.6 family bill cache writes at 1.25x input and
#   report them as `usage.input_tokens_details.cache_write_tokens`; the other
#   rows list no write price.
# - Sampling controls are model-specific: the Astra docs say to remove
#   `temperature`/`top_p`; in live probes, gpt-5.4 and gpt-5.4-mini accepted
#   them and every other GPT-5 row rejected them with a 400.
# - The pro rows support no prompt caching (no cached rate on the pricing
#   page) and no speed tiers: they are absent from the priority and flex
#   tables, and a `service_tier: "priority"` request is silently downgraded
#   to `default` rather than rejected — so claiming `fast` here would bill
#   standard without delivering priority.
# - Reasoning effort vocabularies: the Astra docs list
#   low/medium/high/xhigh/max and reject `none`; per live 400 messages, the
#   5.6 family takes none/low/medium/high/xhigh/max, gpt-5.4, gpt-5.4-mini,
#   and gpt-5.5 take none/low/medium/high/xhigh, and the pro rows take
#   medium/high/xhigh only. No roster model accepts `minimal`.
#
# - Documents: every GPT-5 row reads an inline PDF through `input_file` with
#   `file_data` + `filename`, and `file_url` fetches a remote PDF (both probed
#   live per row on 2026-08-30). The file-input docs cover Astra as a later
#   vision model. `filename` is required beside `file_data` — omitting it
#   draws 400 "Missing required parameter" — so the codec refuses an unnamed
#   inline document before dispatch.
#
# Speed tiers: `fast` maps to priority processing and `economical` to flex.
# Flex is 0.5x standard on every row that has it. Priority is 2x standard
# except gpt-5.5, which OpenAI prices at 2.5x. The speed rates below are
# short-context rates; a long-context request at a priority or flex tier
# still bills that tier's short-context rate here because the schema
# applies speed overrides after the long-context selection.
#
# Access paths: this provider entry is the API-key platform
# (`platform.openai.com`, bearer `OPENAI_API_KEY`). OpenAI also serves a
# ChatGPT-subscription path through the Codex deployment, which fabro
# drives with an OAuth device flow. That path speaks the same Responses
# protocol with a different envelope and roster, so an overlay entry
# selects it explicitly:
#
#   [providers.openai-codex]
#   adapter = "openai"
#   codec = "openai-responses"
#   base_url = "https://chatgpt.com/backend-api/codex"
#   auth = { type = "bearer" }                  # the OAuth access token
#   adapter_options = { mode = "codex" }
#   default_headers = { "ChatGPT-Account-Id" = "<account id>", originator = "<app>" }
#
# Codex mode forces streaming, posts to the unversioned `<base>/responses`
# path (the deployment's `/v1/responses` is an HTML 403), hoists system
# messages into `instructions`, drops `temperature`, `top_p`, and
# `max_output_tokens` with warnings, and reports no native token count
# (the deployment serves no `/responses/input_tokens`). Verified against
# the live deployment with a Codex CLI credential on 2026-08-30: the seat
# served the GPT-5 roster minus the pro rows (gpt-5.5-pro and gpt-5.4-pro
# answer 400 "not supported when using Codex with a ChatGPT account"),
# rejected `stop` like the platform API, spelled error detail as `detail`
# (handled in transport::classify), and sent a terminal `response.completed`
# whose `output` array was empty — the streamed items were the only content.
# Astra's Codex-deployment availability is not yet verified. The live cells
# are `tests/e2e/openai/codex.rs`, gated on `OPENAI_CODEX_TOKEN` and
# `CHATGPT_ACCOUNT_ID`. The built-in catalog carries no codex entry because
# the OAuth token and account id are application state, not environment
# convention.

schema_version = 1

[providers.openai]
display_name = "OpenAI"
aliases = ["oa"]
adapter = "openai"
codec = "openai-responses"
base_url = "https://api.openai.com"
# Fabro's source catalog orders anthropic (100) above openai (90); keeping
# that gap makes the built-in `default` selector unambiguous rather than
# resting on a priority tiebreak.
priority = 90
allow_passthrough = true
default_model = "gpt-5.6-sol"
api_key_url = "https://platform.openai.com/api-keys"

[providers.openai.auth]
type = "bearer"

# The agent profile for this provider's models; a model row overrides it.
[providers.openai.metadata.pebble]
profile = "openai"

[providers.openai.models."gpt-6-astra"]
display_name = "GPT-6 Astra"
aliases = ["astra", "gpt-astra", "gpt6", "gpt-6"]
api_model = "gpt-6-astra"
limits = { context_tokens = 1050000, max_output_tokens = 128000 }
# The model guide says Astra keeps the GPT-5.6 API capabilities, but rejects
# `temperature` and `top_p`, so this row deliberately makes no sampling claim.
capabilities = { text = true, images = true, documents = true, tools = true, response_format = { json_object = true, json_schema = true }, reasoning = true, caching = true, cache_routing = true, tool_choice = { required = true, named = true }, speed = { fast = true, economical = true } }
protocol_options = { reasoning_effort_levels = true }
pricing = { input_usd_micros_per_million = 10000000, output_usd_micros_per_million = 50000000, cached_input_usd_micros_per_million = 1000000, cache_write_usd_micros_per_million = 12500000, long_context = { above_input_tokens = 272000, input_usd_micros_per_million = 20000000, output_usd_micros_per_million = 75000000, cached_input_usd_micros_per_million = 2000000, cache_write_usd_micros_per_million = 25000000 }, speed = { fast = { input_usd_micros_per_million = 20000000, output_usd_micros_per_million = 100000000, cached_input_usd_micros_per_million = 2000000, cache_write_usd_micros_per_million = 25000000 }, economical = { input_usd_micros_per_million = 5000000, output_usd_micros_per_million = 25000000, cached_input_usd_micros_per_million = 500000, cache_write_usd_micros_per_million = 6250000 } } }
family = "gpt-6"
training_cutoff = "2026-04-30"
knowledge_cutoff = "April 30, 2026"

[providers.openai.models."gpt-6-astra".metadata.pebble]
profile = "gpt6"

[providers.openai.models."gpt-5.6-sol"]
