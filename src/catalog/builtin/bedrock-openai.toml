# Translated from Fabro bedrock-openai.toml at 775b62b500c957fe319710fe34e6327ae1eb1bbf.
# Imported 2026-09-05. Limits, prices, and capabilities are provisional
# except for the documentation corrections below. No live tests have run.
# TODO: Complete docs/provider-live-tests.md before claiming live support.
#
# Uses Responses, not Converse, with a plain HTTP bearer Bedrock API key.
# No SigV4 or AWS default-chain fallback applies to this adapter.
# The current AWS Responses guide uses /v1 on mantle; replace Fabro's
# /openai/v1 base path. Override the regional base_url for your account.
# The existing Responses codec sends store=false.
# Fabro enabled=false is application policy: use enabled_providers to opt in.
# https://docs.aws.amazon.com/bedrock/latest/userguide/bedrock-mantle.html

schema_version = 1

[providers.bedrock-openai]
display_name = "Amazon Bedrock (OpenAI frontier)"
adapter = "openai"
codec = "openai-responses"
base_url = "https://bedrock-mantle.us-east-1.api.aws/v1"
priority = 19
allow_passthrough = true
default_model = "gpt-5.5"
api_key_url = "https://docs.aws.amazon.com/bedrock/latest/userguide/api-keys.html"
# Opt-in: operators enable this provider in their own catalog overlay.
enabled = false

[providers.bedrock-openai.auth]
type = "bearer"

[providers.bedrock-openai.metadata.pebble]
profile = "openai"

[providers.bedrock-openai.models."gpt-5.5"]
display_name = "GPT-5.5 (Bedrock)"
api_model = "openai.gpt-5.5"
limits = { context_tokens = 272000, max_output_tokens = 128000 }
capabilities = { text = true, images = true, tools = true, reasoning = true, caching = false, sampling = true, tool_choice = { required = "unknown", named = "unknown" }, response_format = { json_object = "unknown", json_schema = "unknown" }, speed = { fast = false, economical = false } }
protocol_options = { reasoning_effort_levels = true }
pricing = { input_usd_micros_per_million = 5500000, output_usd_micros_per_million = 33000000 }
family = "gpt-5"

[providers.bedrock-openai.models."gpt-5.4"]
display_name = "GPT-5.4 (Bedrock)"
api_model = "openai.gpt-5.4"
limits = { context_tokens = 272000, max_output_tokens = 128000 }
capabilities = { text = true, images = true, tools = true, reasoning = true, caching = false, sampling = true, tool_choice = { required = "unknown", named = "unknown" }, response_format = { json_object = "unknown", json_schema = "unknown" }, speed = { fast = false, economical = false } }
protocol_options = { reasoning_effort_levels = true }
pricing = { input_usd_micros_per_million = 2750000, output_usd_micros_per_million = 16500000 }
family = "gpt-5"
