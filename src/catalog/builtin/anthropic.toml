# Anthropic, translated from fabro's `anthropic.toml` and verified on
# 2026-08-29 against Anthropic's official model, pricing, context, caching,
# effort, thinking, structured-output, and API documentation plus the
# authenticated `GET /v1/models` listing and raw Messages API probes.
#
# The live listing supplies limits and per-model capability objects. One
# listing value is wrong: it reports a 1M input limit for Sonnet 4.5, but a
# 280,023-token Messages request returned `prompt is too long ... > 200000
# maximum`, agreeing with Anthropic's current context-window guide. Live
# behavior wins, so that row stays at 200k.
#
# Fabro's fast rates for Opus 4.7 and 4.6 are stale. Anthropic documents fast
# mode only for Opus 5 and Opus 4.8; Opus 4.7 rejects it, while Opus 4.6 runs
# at standard speed and standard rates. Anthropic also corrected Sonnet 5's
# launch price to a permanent $2/$10 per million tokens.
#
# Claude Fable 5.1 was added on 2026-09-01 from its release notes and the live
# listing. The `fable` and `claude-fable` aliases stay on Fable 5 for now.

schema_version = 1

[providers.anthropic]
display_name = "Anthropic"
aliases = ["claude"]
adapter = "anthropic"
codec = "anthropic-messages"
base_url = "https://api.anthropic.com"
priority = 100
allow_passthrough = true
default_model = "claude-sonnet-5"

[providers.anthropic.auth]
type = "header"
name = "x-api-key"

# The agent profile for this provider's models; a model row overrides it.
[providers.anthropic.metadata.pebble]
profile = "anthropic"

[providers.anthropic.models."claude-fable-5.1"]
display_name = "Claude Fable 5.1"
api_model = "claude-fable-5-1"
limits = { context_tokens = 1000000, max_output_tokens = 128000 }
# Fable 5.1 always uses adaptive thinking and rejects non-default sampling
# values, like Fable 5. Unlike Fable 5 it returns a 400 for a forced tool
# choice (`tool_choice` any/tool), on count_tokens too, so the row claims tools
# without forced_tool_choice. Cache reads are $0.25/MTok, a quarter of Fable
# 5's rate; the other rates are unchanged. Verified 2026-09-01.
# A system message appended mid-conversation goes out as a system turn, not
# into the top-level field: the top-level prefix is bound to every thinking
# block on this model, so hoisting would invalidate them (probed 2026-09-01).
capabilities = { text = true, images = true, documents = true, tools = true, response_format = { json_object = true, json_schema = true }, reasoning = true, caching = true, tool_choice = { required = false, named = false }, speed = { fast = false, economical = false } }
protocol_options = { system_turns = true, reasoning_effort_levels = true }
pricing = { input_usd_micros_per_million = 10000000, output_usd_micros_per_million = 50000000, cached_input_usd_micros_per_million = 250000, cache_write_usd_micros_per_million = 12500000 }

[providers.anthropic.models."claude-fable-5.1".metadata.fabro]
agent_profile = "claude-5"
family = "claude-5"
api_key_url = "https://console.anthropic.com/settings/keys"

[providers.anthropic.models."claude-fable-5.1".metadata.pebble]
profile = "claude-5"

