# Fireworks AI, translated from fabro's `fireworks.toml` and verified on
# 2026-08-29 against Fireworks' official API, model-library, pricing,
# reasoning, caching, tool-calling, structured-output, and vision docs plus
# the authenticated model listing and raw Chat Completions probes.
#
# Live behavior replaces several fabro claims. Kimi K2.6 accepts images and
# reasons, Qwen 3.7 Plus reasons, and the current DeepSeek releases use the
# dated 0731/0813 wire ids and their newer prices. The roster union adds GLM
# 5.3 and Qwen 3.8 Max because Fireworks serves models already carried by the
# Venice and OpenRouter catalogs.

schema_version = 1

[providers.fireworks]
display_name = "Fireworks AI"
adapter = "openai-compatible"
codec = "openai-chat"
base_url = "https://api.fireworks.ai/inference/v1"
priority = 30
allow_passthrough = true
default_model = "kimi-k2.7-code"

[providers.fireworks.auth]
type = "bearer"

[providers.fireworks.metadata.fabro]
api_key_url = "https://app.fireworks.ai/settings/users/api-keys"

# The agent profile for this provider's models; a model row overrides it.
[providers.fireworks.metadata.pebble]
profile = "openai"

[providers.fireworks.models."kimi-k3"]
display_name = "Kimi K3"
api_model = "accounts/fireworks/models/kimi-k3"
limits = { context_tokens = 1048576, max_output_tokens = 131072 }
capabilities = { text = true, images = true, tools = true, structured_output = true, reasoning = true, reasoning_effort_levels = true, caching = true }
pricing = { input_usd_micros_per_million = 3000000, output_usd_micros_per_million = 15000000, cached_input_usd_micros_per_million = 300000 }

[providers.fireworks.models."kimi-k3".metadata.fabro]
agent_profile = "kimi"
family = "kimi-k3"

[providers.fireworks.models."kimi-k3".metadata.pebble]
profile = "kimi"

[providers.fireworks.models."kimi-k3-fast"]
display_name = "Kimi K3 Fast"
api_model = "accounts/fireworks/routers/kimi-k3-fast"
limits = { context_tokens = 1048576, max_output_tokens = 131072 }
# Fireworks documents this router as the K3 Fast tier at 50% above standard.
capabilities = { text = true, images = true, tools = true, structured_output = true, reasoning = true, reasoning_effort_levels = true, caching = true }
pricing = { input_usd_micros_per_million = 4500000, output_usd_micros_per_million = 22500000, cached_input_usd_micros_per_million = 450000 }

[providers.fireworks.models."kimi-k3-fast".metadata.fabro]
agent_profile = "kimi"
family = "kimi-k3"

[providers.fireworks.models."kimi-k3-fast".metadata.pebble]
profile = "kimi"

[providers.fireworks.models."kimi-k2.7-code"]
display_name = "Kimi K2.7 Code"
api_model = "accounts/fireworks/models/kimi-k2p7-code"
limits = { context_tokens = 262144, max_output_tokens = 32768 }
capabilities = { text = true, images = true, tools = true, structured_output = true, reasoning = true, caching = true, sampling = true }
pricing = { input_usd_micros_per_million = 950000, output_usd_micros_per_million = 4000000, cached_input_usd_micros_per_million = 190000 }

[providers.fireworks.models."kimi-k2.7-code".metadata.fabro]
family = "kimi-k2"

[providers.fireworks.models."kimi-k2.7-code".metadata.pebble]
profile = "kimi"

[providers.fireworks.models."kimi-k2.6"]
display_name = "Kimi K2.6"
api_model = "accounts/fireworks/models/kimi-k2p6"
limits = { context_tokens = 262144, max_output_tokens = 16384 }
# The live listing and probes override fabro's no-vision/no-reasoning claim.
capabilities = { text = true, images = true, tools = true, structured_output = true, reasoning = true, caching = true, sampling = true }
pricing = { input_usd_micros_per_million = 950000, output_usd_micros_per_million = 4000000, cached_input_usd_micros_per_million = 160000 }

[providers.fireworks.models."kimi-k2.6".metadata.fabro]
family = "kimi-k2"

[providers.fireworks.models."kimi-k2.6".metadata.pebble]
profile = "kimi"

[providers.fireworks.models."deepseek-v4-pro"]
display_name = "DeepSeek V4 Pro"
api_model = "accounts/fireworks/models/deepseek-v4-pro-0813"
limits = { context_tokens = 1048576, max_output_tokens = 16384 }
# Fireworks says the 0813 release supersedes the preview id in fabro.
capabilities = { text = true, tools = true, structured_output = true, reasoning = true, reasoning_effort_levels = true, caching = true }
pricing = { input_usd_micros_per_million = 1320000, output_usd_micros_per_million = 3960000, cached_input_usd_micros_per_million = 44000 }

[providers.fireworks.models."deepseek-v4-pro".metadata.fabro]
