# Roster-union row. Fireworks launched GLM 5.3 on 2026-08-28 and the live
# listing and completion, schema, effort, and forced-tool probes passed.
[providers.fireworks.models."glm-5.3"]
display_name = "GLM 5.3 (via Fireworks)"
aliases = ["glm53", "glm5.3", "glm-5-3"]
api_model = "accounts/fireworks/models/glm-5p3"
limits = { context_tokens = 1048576, max_output_tokens = 131072 }
capabilities = { text = true, tools = true, response_format = { json_object = true, json_schema = true }, reasoning = true, caching = true, sampling = true, tool_choice = { required = true, named = true }, speed = { fast = false, economical = false } }
protocol_options = { reasoning_effort_levels = true }
pricing = { input_usd_micros_per_million = 1400000, output_usd_micros_per_million = 4400000, cached_input_usd_micros_per_million = 260000 }

[providers.fireworks.models."qwen3.7-plus"]
display_name = "Qwen3.7 Plus"
api_model = "accounts/fireworks/models/qwen3p7-plus"
limits = { context_tokens = 262144, max_output_tokens = 16384 }
# The live response carried reasoning, overriding fabro's false claim.
capabilities = { text = true, images = true, tools = true, response_format = { json_object = true, json_schema = true }, reasoning = true, caching = true, sampling = true, tool_choice = { required = true, named = true }, speed = { fast = false, economical = false } }
pricing = { input_usd_micros_per_million = 400000, output_usd_micros_per_million = 1600000, cached_input_usd_micros_per_million = 80000 }
family = "qwen3"

# Roster-union row. The live alias accepts images, schemas, and forced tools.
# Fireworks' model page maps it to the 262k Qwen3.8 2.4T model and supplies
# these rates; the listing omits the alias's context length.
[providers.fireworks.models."qwen3.8-max"]
display_name = "Qwen 3.8 Max (via Fireworks)"
aliases = ["qwen", "qwen-max", "qwen3.8", "qwen-3.8", "qwen38", "qwen-3.8-max", "qwen38-max"]
api_model = "accounts/fireworks/models/qwen3p8-max"
limits = { context_tokens = 262144, max_output_tokens = 131072 }
capabilities = { text = true, images = true, tools = true, response_format = { json_object = true, json_schema = true }, reasoning = true, caching = true, sampling = true, tool_choice = { required = true, named = true }, speed = { fast = false, economical = false } }
pricing = { input_usd_micros_per_million = 2000000, output_usd_micros_per_million = 6000000, cached_input_usd_micros_per_million = 250000 }

# Qwen 3.8 Max reasons on every call whoever serves it; it takes a thinking
# budget rather than a named effort level, so no capability records it.
[providers.fireworks.models."qwen3.8-max".metadata.agent]
reasoning_by_default = true

