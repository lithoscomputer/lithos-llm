# Translated from Fabro deepseek.toml at 775b62b500c957fe319710fe34e6327ae1eb1bbf.
# Imported 2026-09-05. Limits, prices, and capabilities are provisional
# except for the documentation corrections below. No live tests have run.
# TODO: Complete docs/provider-live-tests.md before claiming live support.
#
# DeepSeek documents low/high/max on both V4 models as of 2026-09-05.
# medium and xhigh are accepted and map to high; sampling is ignored in thinking mode.
# https://api-docs.deepseek.com/guides/thinking_mode/

schema_version = 1

[providers.deepseek]
display_name = "DeepSeek"
adapter = "openai-compatible"
codec = "openai-chat"
base_url = "https://api.deepseek.com"
priority = 75
allow_passthrough = true
default_model = "deepseek-v4-flash"

[providers.deepseek.auth]
type = "bearer"

[providers.deepseek.metadata.fabro]
api_key_url = "https://platform.deepseek.com/api_keys"

[providers.deepseek.metadata.pebble]
profile = "openai"

[providers.deepseek.models."deepseek-v4-flash"]
display_name = "DeepSeek V4 Flash"
aliases = ["deepseek-v4", "deepseek", "deepseek-flash"]
api_model = "deepseek-v4-flash"
limits = { context_tokens = 1048576, max_output_tokens = 384000 }
capabilities = { text = true, images = false, tools = true, reasoning = true, caching = true, sampling = false, tool_choice = { required = "unknown", named = "unknown" }, response_format = { json_object = "unknown", json_schema = "unknown" }, speed = { fast = false, economical = false }, reasoning_effort = { minimal = false, low = true, medium = true, high = true, xhigh = true, max = true } }
protocol_options = { reasoning_effort_levels = true }
pricing = { input_usd_micros_per_million = 140000, output_usd_micros_per_million = 280000, cached_input_usd_micros_per_million = 2800 }

[providers.deepseek.models."deepseek-v4-flash".metadata.fabro]
agent_profile = "openai"
family = "deepseek-v4"
probe = true
small_default = true

[providers.deepseek.models."deepseek-v4-pro"]
display_name = "DeepSeek V4 Pro"
api_model = "deepseek-v4-pro"
limits = { context_tokens = 1048576, max_output_tokens = 384000 }
capabilities = { text = true, images = false, tools = true, reasoning = true, caching = true, sampling = false, tool_choice = { required = "unknown", named = "unknown" }, response_format = { json_object = "unknown", json_schema = "unknown" }, speed = { fast = false, economical = false }, reasoning_effort = { minimal = false, low = true, medium = true, high = true, xhigh = true, max = true } }
protocol_options = { reasoning_effort_levels = true }
pricing = { input_usd_micros_per_million = 435000, output_usd_micros_per_million = 870000, cached_input_usd_micros_per_million = 3625 }

[providers.deepseek.models."deepseek-v4-pro".metadata.fabro]
agent_profile = "openai"
family = "deepseek-v4"
