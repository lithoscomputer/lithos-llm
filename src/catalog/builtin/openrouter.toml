# OpenRouter, translated from fabro's `openrouter.toml` and checked
# against OpenRouter's live `GET /api/v1/models` listing on 2026-08-29.
# The roster also includes three models from the Venice union policy:
# grok-4.6, glm-5.3, and qwen3.8-27b. Live listing values win where fabro's
# limits or prices differ.
#
# Capability flags follow the listing's `supported_parameters` and input
# modalities. Spot checks confirmed forced tool calls on Claude Opus 5 and
# Laguna XS 2.1, structured-output request acceptance on Gemini 3.5 Flash,
# provider-reported `usage.cost`, and numeric error codes. The Chat codec
# cannot carry document or audio parts, so those inputs remain unclaimed.
#
# OpenRouter documents sticky prompt-cache routing through `session_id`.
# Lithos currently emits `prompt_cache_key` for `cache_routing`, so no row
# claims that capability. Claude rows do claim explicit cache breakpoints,
# which OpenRouter documents for its Chat Completions endpoint.

schema_version = 1

[providers.openrouter]
display_name = "OpenRouter"
adapter = "openai-compatible"
codec = "openai-chat"
base_url = "https://openrouter.ai/api/v1"
priority = 25
allow_passthrough = true
default_model = "claude-sonnet-5"

[providers.openrouter.auth]
type = "bearer"

# The agent profile for this provider's models; a model row overrides it.
[providers.openrouter.metadata.pebble]
profile = "openai"

