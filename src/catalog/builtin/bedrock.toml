# The built-in bedrock provider. One file per provider; each file is a
# standalone catalog layer.

schema_version = 1

[providers.bedrock]
display_name = "Amazon Bedrock"
aliases = ["aws-bedrock"]
adapter = "bedrock"
codec = "bedrock-converse"
base_url = "https://bedrock-runtime.us-east-1.amazonaws.com"
priority = 50
allow_passthrough = true
default_model = "anthropic.claude-sonnet-4-6"

[providers.bedrock.auth]
type = "aws"
region = "us-east-1"

# The agent profile for this provider's models; a model row overrides it.
[providers.bedrock.metadata.pebble]
profile = "anthropic"

[providers.bedrock.models."anthropic.claude-sonnet-4-6"]
display_name = "Claude Sonnet 4.6 on Bedrock"
aliases = ["bedrock-sonnet", "claude-sonnet-4-6"]
# The `us.` cross-region inference profile: Bedrock on-demand access to this
# model needs the profile rather than the bare model id.
api_model = "us.anthropic.claude-sonnet-4-6"
limits = { context_tokens = 200000, max_output_tokens = 64000 }
capabilities = { text = true, images = true, documents = true, tools = true, reasoning = true, caching = true, sampling = true, tool_choice = { required = true, named = true }, speed = { fast = false, economical = false } }
protocol_options = { reasoning_effort_levels = true }
pricing = { input_usd_micros_per_million = 3000000, output_usd_micros_per_million = 15000000, cached_input_usd_micros_per_million = 300000, cache_write_usd_micros_per_million = 3750000 }

[providers.bedrock.models."anthropic.claude-sonnet-4-6".metadata.pebble]
profile = "claude-5"
