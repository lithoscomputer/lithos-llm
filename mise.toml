min_version = "2026.6.11"

[settings]
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-x64", "linux-arm64"]
minimum_release_age = "24h"

[tools]
"cargo:cargo-nextest" = { version = "0.9.140", locked = true }
rust = [
  { version = "1.97.1", profile = "minimal", components = ["clippy"] },
  { version = "1.88.0", profile = "minimal" },
  { version = "nightly-2026-04-14", profile = "minimal", components = ["rustfmt"] },
]
zizmor = "1.29.0"

[tasks.setup]
description = "Prepare the pinned Rust style guide"
run = "bin/style-guides prepare"

[tasks.dev]
description = "Check all default-feature targets"
run = "cargo check --locked --all-targets"

[tasks.fmt]
description = "Format Rust with the pinned nightly formatter"
run = "cargo +nightly-2026-04-14 fmt --all"

[tasks."fmt:check"]
description = "Check Rust formatting without changing files"
run = "cargo +nightly-2026-04-14 fmt --check --all"

[tasks.lint]
description = "Lint all Rust targets with warnings denied"
env = { CARGO_TARGET_DIR = "{{config_root}}/target/clippy" }
run = "cargo clippy --locked --all-targets --all-features -- -D warnings"

[tasks.test]
description = "Run all Rust tests with Nextest"
run = "cargo nextest run --locked --all-targets --all-features --no-tests=pass"

[tasks."test:default-features"]
description = "Run the tests with the default feature set"
env = { CARGO_TARGET_DIR = "{{config_root}}/target/default-features" }
run = "cargo nextest run --locked --all-targets --no-tests=pass"

# The E2E suite runs against one of three backends. `test:e2e` (the
# default) replays the committed recording offline through a twin-openai
# proxy: no keys, no network, deterministic. `test:e2e:record` runs live
# through the proxy and rewrites the recording — a changed recording is the
# drift report. `test:e2e:live` is the unproxied nightly battery. A replay
# failure with `scenario_not_found` means the recording is stale: run
# `mise run test:e2e:record`.
#
# Nextest gives every test its own process, so --test-threads caps
# concurrent requests. --success-output final keeps passing tests' stderr
# in the log: the effort, cache-bucket, and rate-limit probes report
# through it.
[tasks."test:e2e"]
description = "Replay the E2E suite offline against the committed recording"
run = """
set -e
cargo build --locked --all-features --example e2e_twin
LITHOS_E2E_TWIN_MODE=replay ./target/debug/examples/e2e_twin &
VENICE_TWIN_PID=$!
LITHOS_E2E_TWIN_MODE=replay \
LITHOS_E2E_TWIN_ADDR=127.0.0.1:3922 \
LITHOS_E2E_RECORDING_PATH=tests/e2e/recordings/openrouter.json \
./target/debug/examples/e2e_twin &
OPENROUTER_TWIN_PID=$!
trap 'kill $VENICE_TWIN_PID $OPENROUTER_TWIN_PID 2>/dev/null || true' EXIT
for _ in $(seq 1 50); do curl -sf http://127.0.0.1:3921/healthz >/dev/null 2>&1 && break; sleep 0.1; done
for _ in $(seq 1 50); do curl -sf http://127.0.0.1:3922/healthz >/dev/null 2>&1 && break; sleep 0.1; done
LITHOS_E2E_BACKEND=replay cargo nextest run --locked --all-features --test e2e --run-ignored all --test-threads 4 --no-fail-fast --success-output final --no-tests=pass
"""

[tasks."test:e2e:record"]
description = "Re-record the E2E suite through the twin proxy (spends provider credits)"
run = """
set -e
set -a; [ -f .env ] && . ./.env; set +a
cargo build --locked --all-features --example e2e_twin
LITHOS_E2E_TWIN_MODE=record ./target/debug/examples/e2e_twin &
VENICE_TWIN_PID=$!
LITHOS_E2E_TWIN_MODE=record \
LITHOS_E2E_TWIN_ADDR=127.0.0.1:3922 \
LITHOS_E2E_RECORDING_PATH=tests/e2e/recordings/openrouter.json \
LITHOS_E2E_UPSTREAM_URL=https://openrouter.ai/api \
LITHOS_E2E_API_KEY_VARIABLE=OPENROUTER_API_KEY \
./target/debug/examples/e2e_twin &
OPENROUTER_TWIN_PID=$!
trap 'kill $VENICE_TWIN_PID $OPENROUTER_TWIN_PID 2>/dev/null || true' EXIT
for _ in $(seq 1 50); do curl -sf http://127.0.0.1:3921/healthz >/dev/null 2>&1 && break; sleep 0.1; done
for _ in $(seq 1 50); do curl -sf http://127.0.0.1:3922/healthz >/dev/null 2>&1 && break; sleep 0.1; done
LITHOS_E2E_BACKEND=record cargo nextest run --locked --all-features --test e2e --run-ignored all --test-threads 4 --no-fail-fast --success-output final --no-tests=pass
"""

[tasks."test:e2e:live"]
description = "Run the live provider E2E suite unproxied (spends provider credits)"
run = "sh -c 'set -a; [ -f .env ] && . ./.env; set +a; LITHOS_E2E_BACKEND=live cargo nextest run --locked --all-features --test e2e --run-ignored all --test-threads 4 --no-fail-fast --success-output final --no-tests=pass'"

[tasks."test:release"]
description = "Run all Rust tests in release mode"
run = "cargo nextest run --locked --release --all-targets --all-features --no-tests=pass"

[tasks."check:msrv"]
description = "Check all targets with the declared minimum Rust version"
env = { CARGO_TARGET_DIR = "{{config_root}}/target/msrv" }
run = "cargo +1.88.0 check --locked --all-targets --all-features"

[tasks."check:actions"]
description = "Audit GitHub Actions workflows"
run = "zizmor .github/workflows"

[tasks."check:catalog-only"]
description = "Verify that catalog-only builds exclude runtime dependencies"
run = '''
cargo check --locked --no-default-features --features builtin-catalog
if cargo tree --locked -e normal --no-default-features --features builtin-catalog | grep -Eq '(^| )(tokio|reqwest|aws-[a-z0-9_-]+) v'; then
  echo "catalog-only feature unexpectedly includes a runtime dependency" >&2
  exit 1
fi
'''

[tasks."check:features"]
description = "Check each additive feature and the AWS SDK boundary"
run = '''
for feature in runtime openai anthropic gemini openai-compatible bedrock bedrock-aws; do
  cargo check --locked --no-default-features --features "$feature"
done

# `aws-lc-rs` and `aws-lc-sys` are the rustls TLS backend, not AWS SDK crates.
assert_no_aws_sdk() {
  label="$1"
  shift
  if cargo tree --locked -e normal "$@" | grep -E '(^| )aws-[a-z0-9_-]+ v' | grep -qv 'aws-lc-'; then
    echo "$label unexpectedly pulls in an AWS SDK dependency" >&2
    exit 1
  fi
}

assert_no_aws_sdk "default features"
assert_no_aws_sdk "the bedrock feature" --no-default-features --features bedrock
'''

[tasks."check:whitespace"]
description = "Check tracked and untracked patches for whitespace errors"
run = ["git diff --check", "git diff --cached --check"]

[tasks.check]
description = "Run the complete routine verification gate"
depends = ["fmt:check", "lint", "test", "test:default-features", "test:e2e", "check:actions", "check:catalog-only", "check:features", "check:whitespace"]

[tasks."check:nightly"]
description = "Run the extended nightly verification gate"
depends = ["check", "check:msrv", "test:release"]

[tasks.release]
description = "Build and checksum a crates.io source package"
run = "bin/build-release"
