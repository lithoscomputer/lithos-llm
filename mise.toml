min_version = "2026.6.11"

# Task output is consumed by agents and must stay quiet and plain while
# passing. Cargo and Nextest emit OSC 9;4 terminal-progress escapes when
# they detect a supporting terminal; terminals without that protocol
# render them as literal escape sequences, so they are off for every task.
[env]
CARGO_TERM_PROGRESS_TERM_INTEGRATION = "false"

[settings]
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-x64", "linux-arm64"]
minimum_release_age = "24h"

[tools]
"cargo:cargo-nextest" = { version = "0.9.140", locked = true }
rust = [
  { version = "1.97.1", profile = "minimal", components = ["clippy"] },
  { version = "1.88.0", profile = "minimal" },
  { version = "nightly-2026-04-14", profile = "minimal", components = ["rustfmt"] },
]
zizmor = "1.29.0"

[tasks.setup]
quiet = true
description = "Prepare the pinned Rust style guide"
run = "bin/style-guides prepare"

[tasks.dev]
quiet = true
description = "Check all default-feature targets"
run = "cargo check -q --locked --workspace --all-targets"

[tasks.fmt]
quiet = true
description = "Format Rust with the pinned nightly formatter"
run = "cargo +nightly-2026-04-14 fmt --all"

[tasks."fmt:check"]
quiet = true
description = "Check Rust formatting without changing files"
run = "cargo +nightly-2026-04-14 fmt --check --all"

[tasks.lint]
quiet = true
description = "Lint all Rust targets with warnings denied"
env = { CARGO_TARGET_DIR = "{{config_root}}/target/clippy" }
run = "cargo clippy -q --locked --workspace --all-targets --all-features -- -D warnings"

[tasks.test]
quiet = true
description = "Run all Rust tests with Nextest"
run = "cargo nextest run --cargo-quiet --status-level fail --show-progress none --locked --workspace --all-targets --all-features --no-tests=pass"

[tasks."test:default-features"]
quiet = true
description = "Run the tests with the default feature set"
env = { CARGO_TARGET_DIR = "{{config_root}}/target/default-features" }
run = "cargo nextest run --cargo-quiet --status-level fail --show-progress none --locked --workspace --all-targets --no-tests=pass"

# The E2E suite runs against one of three backends. `test:e2e` (the
# default) replays the committed recording offline through a twin-openai
# proxy: no keys, no network, deterministic. `test:e2e:record` runs live
# through the proxy and rewrites the recording — a changed recording is the
# drift report. `test:e2e:live` is the unproxied nightly battery. A replay
# failure with `scenario_not_found` means the recording is stale: run
# `mise run test:e2e:record`.
#
# Nextest gives every test its own process, so --test-threads caps
# concurrent requests. Task output stays quiet while passing (agents
# consume it): cargo runs with -q, Nextest hides per-test PASS lines with
# --status-level fail, and only the record and live tasks keep
# --success-output final, because the effort, cache-bucket, and rate-limit
# probes report fresh observations through passing tests' stderr there —
# under replay the same output is just the recording played back.
[tasks."test:e2e"]
quiet = true
description = "Replay the E2E suite offline against the committed recording"
run = """
set -e
cargo build -q --locked --all-features --example e2e_twin
LITHOS_E2E_TWIN_MODE=replay ./target/debug/examples/e2e_twin &
VENICE_TWIN_PID=$!
LITHOS_E2E_TWIN_MODE=replay \
LITHOS_E2E_TWIN_ADDR=127.0.0.1:3922 \
LITHOS_E2E_RECORDING_PATH=tests/e2e/recordings/openrouter.json \
./target/debug/examples/e2e_twin &
OPENROUTER_TWIN_PID=$!
LITHOS_E2E_TWIN_MODE=replay \
LITHOS_E2E_TWIN_ADDR=127.0.0.1:3923 \
LITHOS_E2E_RECORDING_PATH=tests/e2e/recordings/moonshot.json \
./target/debug/examples/e2e_twin &
MOONSHOT_TWIN_PID=$!
LITHOS_E2E_TWIN_MODE=replay \
LITHOS_E2E_TWIN_ADDR=127.0.0.1:3924 \
LITHOS_E2E_RECORDING_PATH=tests/e2e/recordings/fireworks.json \
./target/debug/examples/e2e_twin &
FIREWORKS_TWIN_PID=$!
LITHOS_E2E_TWIN_MODE=replay \
LITHOS_E2E_TWIN_ADDR=127.0.0.1:3925 \
LITHOS_E2E_RECORDING_PATH=tests/e2e/recordings/openai.json \
./target/debug/examples/e2e_twin &
OPENAI_TWIN_PID=$!
LITHOS_E2E_TWIN_MODE=replay \
LITHOS_E2E_TWIN_ADDR=127.0.0.1:3926 \
LITHOS_E2E_RECORDING_PATH=tests/e2e/recordings/openai_codex.json \
./target/debug/examples/e2e_twin &
CODEX_TWIN_PID=$!
trap 'kill $VENICE_TWIN_PID $OPENROUTER_TWIN_PID $MOONSHOT_TWIN_PID $FIREWORKS_TWIN_PID $OPENAI_TWIN_PID $CODEX_TWIN_PID 2>/dev/null || true' EXIT
for _ in $(seq 1 50); do curl -sf http://127.0.0.1:3921/healthz >/dev/null 2>&1 && break; sleep 0.1; done
for _ in $(seq 1 50); do curl -sf http://127.0.0.1:3922/healthz >/dev/null 2>&1 && break; sleep 0.1; done
for _ in $(seq 1 50); do curl -sf http://127.0.0.1:3923/healthz >/dev/null 2>&1 && break; sleep 0.1; done
for _ in $(seq 1 50); do curl -sf http://127.0.0.1:3924/healthz >/dev/null 2>&1 && break; sleep 0.1; done
for _ in $(seq 1 50); do curl -sf http://127.0.0.1:3925/healthz >/dev/null 2>&1 && break; sleep 0.1; done
for _ in $(seq 1 50); do curl -sf http://127.0.0.1:3926/healthz >/dev/null 2>&1 && break; sleep 0.1; done
LITHOS_E2E_BACKEND=replay cargo nextest run --cargo-quiet --status-level fail --show-progress none --locked --all-features --test e2e --run-ignored all --test-threads 4 --no-fail-fast --no-tests=pass
"""

[tasks."test:e2e:record"]
quiet = true
description = "Re-record the E2E suite through the twin proxy (spends provider credits)"
run = """
set -e
set -a; [ -f .env ] && . ./.env; set +a
cargo build -q --locked --all-features --example e2e_twin
LITHOS_E2E_TWIN_MODE=record ./target/debug/examples/e2e_twin &
VENICE_TWIN_PID=$!
LITHOS_E2E_TWIN_MODE=record \
LITHOS_E2E_TWIN_ADDR=127.0.0.1:3922 \
LITHOS_E2E_RECORDING_PATH=tests/e2e/recordings/openrouter.json \
LITHOS_E2E_UPSTREAM_URL=https://openrouter.ai/api \
LITHOS_E2E_API_KEY_VARIABLE=OPENROUTER_API_KEY \
./target/debug/examples/e2e_twin &
OPENROUTER_TWIN_PID=$!
LITHOS_E2E_TWIN_MODE=record \
LITHOS_E2E_TWIN_ADDR=127.0.0.1:3923 \
LITHOS_E2E_RECORDING_PATH=tests/e2e/recordings/moonshot.json \
LITHOS_E2E_UPSTREAM_URL=https://api.moonshot.ai \
LITHOS_E2E_API_KEY_VARIABLE=MOONSHOT_API_KEY \
./target/debug/examples/e2e_twin &
MOONSHOT_TWIN_PID=$!
LITHOS_E2E_TWIN_MODE=record \
LITHOS_E2E_TWIN_ADDR=127.0.0.1:3924 \
LITHOS_E2E_RECORDING_PATH=tests/e2e/recordings/fireworks.json \
LITHOS_E2E_UPSTREAM_URL=https://api.fireworks.ai/inference \
LITHOS_E2E_API_KEY_VARIABLE=FIREWORKS_API_KEY \
./target/debug/examples/e2e_twin &
FIREWORKS_TWIN_PID=$!
LITHOS_E2E_TWIN_MODE=record \
LITHOS_E2E_TWIN_ADDR=127.0.0.1:3925 \
LITHOS_E2E_RECORDING_PATH=tests/e2e/recordings/openai.json \
LITHOS_E2E_UPSTREAM_URL=https://api.openai.com \
LITHOS_E2E_API_KEY_VARIABLE=OPENAI_API_KEY \
./target/debug/examples/e2e_twin &
OPENAI_TWIN_PID=$!
# The Codex twin needs a ChatGPT OAuth token that no .env line carries
# (export OPENAI_CODEX_TOKEN and CHATGPT_ACCOUNT_ID before recording, e.g.
# from the Codex CLI's ~/.codex/auth.json). Without the token the twin is
# not started and the codex cells skip on the missing CHATGPT_ACCOUNT_ID.
CODEX_TWIN_PID=""
if [ -n "$OPENAI_CODEX_TOKEN" ]; then
  LITHOS_E2E_TWIN_MODE=record \
  LITHOS_E2E_TWIN_ADDR=127.0.0.1:3926 \
  LITHOS_E2E_RECORDING_PATH=tests/e2e/recordings/openai_codex.json \
  LITHOS_E2E_UPSTREAM_URL=https://chatgpt.com/backend-api/codex \
  LITHOS_E2E_UPSTREAM_RESPONSES_PATH=/responses \
  LITHOS_E2E_API_KEY_VARIABLE=OPENAI_CODEX_TOKEN \
  ./target/debug/examples/e2e_twin &
  CODEX_TWIN_PID=$!
fi
trap 'kill $VENICE_TWIN_PID $OPENROUTER_TWIN_PID $MOONSHOT_TWIN_PID $FIREWORKS_TWIN_PID $OPENAI_TWIN_PID $CODEX_TWIN_PID 2>/dev/null || true' EXIT
for _ in $(seq 1 50); do curl -sf http://127.0.0.1:3921/healthz >/dev/null 2>&1 && break; sleep 0.1; done
for _ in $(seq 1 50); do curl -sf http://127.0.0.1:3922/healthz >/dev/null 2>&1 && break; sleep 0.1; done
for _ in $(seq 1 50); do curl -sf http://127.0.0.1:3923/healthz >/dev/null 2>&1 && break; sleep 0.1; done
for _ in $(seq 1 50); do curl -sf http://127.0.0.1:3924/healthz >/dev/null 2>&1 && break; sleep 0.1; done
for _ in $(seq 1 50); do curl -sf http://127.0.0.1:3925/healthz >/dev/null 2>&1 && break; sleep 0.1; done
if [ -n "$CODEX_TWIN_PID" ]; then
  for _ in $(seq 1 50); do curl -sf http://127.0.0.1:3926/healthz >/dev/null 2>&1 && break; sleep 0.1; done
fi
LITHOS_E2E_BACKEND=record cargo nextest run --cargo-quiet --status-level fail --show-progress none --locked --all-features --test e2e --run-ignored all --test-threads 4 --no-fail-fast --success-output final --no-tests=pass
"""

[tasks."test:e2e:live"]
quiet = true
description = "Run the live provider E2E suite unproxied (spends provider credits)"
run = "sh -c 'set -a; [ -f .env ] && . ./.env; set +a; LITHOS_E2E_BACKEND=live cargo nextest run --cargo-quiet --status-level fail --show-progress none --locked --all-features --test e2e --run-ignored all --test-threads 4 --no-fail-fast --success-output final --no-tests=pass'"

[tasks."test:release"]
quiet = true
description = "Run all Rust tests in release mode"
run = "cargo nextest run --cargo-quiet --status-level fail --show-progress none --locked --release --workspace --all-targets --all-features --no-tests=pass"

[tasks."check:msrv"]
quiet = true
description = "Check all targets with the declared minimum Rust version"
env = { CARGO_TARGET_DIR = "{{config_root}}/target/msrv" }
run = "cargo +1.88.0 check -q --locked --workspace --all-targets --all-features"

[tasks."check:actions"]
quiet = true
description = "Audit GitHub Actions workflows"
run = "zizmor -qq .github/workflows"

[tasks."check:catalog-only"]
quiet = true
description = "Verify that catalog-only builds exclude runtime dependencies"
run = '''
cargo check -q --locked -p lithos-llm --no-default-features --features builtin-catalog
if cargo tree --locked -p lithos-llm -e normal --no-default-features --features builtin-catalog | grep -Eq '(^| )(tokio|reqwest|aws-[a-z0-9_-]+) v'; then
  echo "catalog-only feature unexpectedly includes a runtime dependency" >&2
  exit 1
fi
'''

[tasks."check:features"]
quiet = true
description = "Check each additive feature and the AWS SDK boundary"
run = '''
for feature in runtime openai anthropic gemini openai-compatible bedrock bedrock-aws; do
  cargo check -q --locked -p lithos-llm --no-default-features --features "$feature"
done

# `aws-lc-rs` and `aws-lc-sys` are the rustls TLS backend, not AWS SDK crates.
assert_no_aws_sdk() {
  label="$1"
  shift
  if cargo tree --locked -e normal "$@" | grep -E '(^| )aws-[a-z0-9_-]+ v' | grep -qv 'aws-lc-'; then
    echo "$label unexpectedly pulls in an AWS SDK dependency" >&2
    exit 1
  fi
}

assert_no_aws_sdk "default features" -p lithos-llm
assert_no_aws_sdk "the bedrock feature" -p lithos-llm --no-default-features --features bedrock
'''

[tasks."check:whitespace"]
quiet = true
description = "Check tracked and untracked patches for whitespace errors"
run = ["git --no-pager diff --check", "git --no-pager diff --cached --check"]

[tasks.check]
quiet = true
description = "Run the complete routine verification gate"
depends = ["fmt:check", "lint", "test", "test:default-features", "test:e2e", "check:actions", "check:catalog-only", "check:features", "check:whitespace"]

[tasks."check:nightly"]
quiet = true
description = "Run the extended nightly verification gate"
depends = ["check", "check:msrv", "test:release"]

[tasks.release]
quiet = true
description = "Build and checksum a crates.io source package"
run = "bin/build-release"
