[package]
name = "lithos-llm"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Provider-neutral language model catalog and client"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/lithoscomputer/lithos-llm"
documentation = "https://docs.rs/lithos-llm"
include = [
  "/build.rs",
  "/src/**",
  "/tests/**",
  "/docs/cli.md",
  "/Cargo.toml",
  "/README.md",
  "/LICENSE-MIT",
  "/LICENSE-APACHE",
]

[[bin]]
name = "lllm"
path = "src/bin/lllm/main.rs"
required-features = ["cli"]

[workspace]
members = ["."]
resolver = "3"

[features]
default = [
  "builtin-catalog",
  "openai",
  "anthropic",
  "gemini",
  "openai-compatible",
  "environment-credentials",
]
builtin-catalog = []
cli = [
  "builtin-catalog",
  "openai",
  "anthropic",
  "gemini",
  "openai-compatible",
  "environment-credentials",
  "dep:base64",
  "dep:clap",
  "dep:humantime",
  "dep:infer",
  "dep:mime",
  "dep:mime_guess",
  "dep:tracing-subscriber",
  "dep:url",
  "tokio/io-std",
  "tokio/rt-multi-thread",
  "tokio/signal",
]
runtime = [
  "dep:async-trait",
  "dep:futures-core",
  "dep:futures-util",
  "dep:reqwest",
  "dep:tokio",
  "dep:tracing",
  "dep:uuid",
]
openai = ["runtime"]
anthropic = ["runtime"]
gemini = ["runtime"]
openai-compatible = ["runtime"]
bedrock = ["runtime", "dep:base64", "dep:crc32fast"]
bedrock-aws = [
  "bedrock",
  "dep:aws-config",
  "dep:aws-credential-types",
  "dep:aws-sigv4",
  "dep:aws-smithy-runtime-api",
  "dep:aws-smithy-types",
]
environment-credentials = ["runtime"]

[dependencies]
async-trait = { version = "0.1.89", optional = true }
aws-config = { version = "1.6.3", features = ["behavior-version-latest", "rustls"], optional = true }
aws-credential-types = { version = "1.2.10", features = ["hardcoded-credentials"], optional = true }
aws-sigv4 = { version = "1.3.6", optional = true }
aws-smithy-runtime-api = { version = "1.9.2", optional = true }
aws-smithy-types = { version = "1.3.4", optional = true }
base64 = { version = "0.22.1", optional = true }
clap = { version = "4.5.47", features = ["derive"], optional = true }
crc32fast = { version = "1.5.0", optional = true }
futures-core = { version = "0.3.32", optional = true }
futures-util = { version = "0.3.32", optional = true }
humantime = { version = "2.2.0", optional = true }
infer = { version = "0.19.0", optional = true }
mime = { version = "0.3.17", optional = true }
mime_guess = { version = "2.0.5", optional = true }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.16"
tokio = { version = "1.49.0", features = ["macros", "sync", "time"], optional = true }
toml = "0.8.23"
tracing = { version = "0.1.41", optional = true }
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["registry", "fmt", "env-filter"], optional = true }
url = { version = "2.5.8", optional = true }
uuid = { version = "1.18.1", features = ["serde", "v4"], optional = true }

[dev-dependencies]
axum = "0.8"
futures-util = "0.3.32"
httpmock = "0.8.2"
insta = { version = "1.48.0", features = ["filters"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde_json = "1.0.145"
tokio = { version = "1.49.0", features = ["macros", "net", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["registry", "fmt", "env-filter"] }
# The record-and-replay proxy for the live E2E suite, pinned to the
# codex-passthrough revision plus input_file support
# (branch codex-passthrough-input-file; twins#7 carries the same fix to
# main) until the twins stack merges.
twin-openai = { git = "https://github.com/lithoscomputer/twins", rev = "9b8fa1b5bac6d8c7f23cfb93967fd5a628e77246" }

[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -2 }
allow_attributes_without_reason = "warn"

implicit_hasher = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
cast_precision_loss = "allow"
doc_markdown = "allow"

print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
disallowed_methods = "deny"
exit = "warn"
get_unwrap = "warn"
unwrap_used = "deny"
rc_buffer = "warn"
rc_mutex = "warn"
rest_pat_in_fully_bound_structs = "warn"
use_self = "warn"
wildcard_imports = "warn"
absolute_paths = "warn"
