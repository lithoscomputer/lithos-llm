[package]
name = "lithos-llm"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Provider-neutral language model catalog and client"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/lithoscomputer/lithos-llm"
documentation = "https://docs.rs/lithos-llm"
include = [
  "/src/**",
  "/tests/**",
  "/Cargo.toml",
  "/README.md",
  "/LICENSE-MIT",
  "/LICENSE-APACHE",
]

[features]
default = [
  "builtin-catalog",
  "openai",
  "anthropic",
  "gemini",
  "openai-compatible",
  "environment-credentials",
]
builtin-catalog = []
runtime = [
  "dep:async-trait",
  "dep:futures-core",
  "dep:futures-util",
  "dep:reqwest",
  "dep:tokio",
  "dep:tracing",
  "dep:uuid",
]
openai = ["runtime"]
anthropic = ["runtime"]
gemini = ["runtime"]
openai-compatible = ["runtime"]
bedrock = [
  "runtime",
  "dep:aws-config",
  "dep:aws-sdk-bedrockruntime",
  "dep:aws-smithy-types",
  "dep:base64",
  "dep:crc32fast",
]
environment-credentials = ["runtime"]

[dependencies]
async-trait = { version = "0.1.89", optional = true }
aws-config = { version = "1.6.3", features = ["behavior-version-latest"], optional = true }
aws-sdk-bedrockruntime = { version = "1.90.0", optional = true }
aws-smithy-types = { version = "1.3.4", optional = true }
base64 = { version = "0.22.1", optional = true }
crc32fast = { version = "1.5.0", optional = true }
futures-core = { version = "0.3.32", optional = true }
futures-util = { version = "0.3.32", optional = true }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.16"
tokio = { version = "1.49.0", features = ["macros", "sync", "time"], optional = true }
toml = "0.8.23"
tracing = { version = "0.1.41", optional = true }
uuid = { version = "1.18.1", features = ["serde", "v4"], optional = true }

[dev-dependencies]
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -2 }
allow_attributes_without_reason = "warn"

implicit_hasher = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
cast_precision_loss = "allow"
doc_markdown = "allow"

print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
disallowed_methods = "deny"
exit = "warn"
get_unwrap = "warn"
unwrap_used = "deny"
rc_buffer = "warn"
rc_mutex = "warn"
rest_pat_in_fully_bound_structs = "warn"
use_self = "warn"
wildcard_imports = "warn"
absolute_paths = "warn"
